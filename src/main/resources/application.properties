# Configuración del servidor
server.port=8080

# ========================================
# CONFIGURACIÓN PARA WAMPSERVER (WAMPP)
# ========================================

# Opción 1: Si WAMP usa MariaDB (recomendado)
spring.datasource.url=jdbc:mariadb://localhost:3306/springboot_crud
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Opción 2: Si WAMP usa MySQL (comenta las líneas de arriba y descomenta estas)
# spring.datasource.url=jdbc:mysql://localhost:3306/springboot_crud
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Credenciales de WAMP (por defecto)
# Usuario root sin contraseña es la configuración estándar de WAMP
spring.datasource.username=root
spring.datasource.password=

# NOTA: Si has configurado una contraseña en WAMP para root, actualiza la línea de arriba
# Ejemplo: spring.datasource.password=tu_contraseña

# NOTA: Si WAMP usa un puerto diferente (ej: 3307), actualiza la URL:
# spring.datasource.url=jdbc:mariadb://localhost:3307/springboot_crud

# ========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# CONFIGURACIÓN DE THYMELEAF
# ========================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ========================================
# LOGGING
# ========================================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.com.danielmitroi=DEBUG
